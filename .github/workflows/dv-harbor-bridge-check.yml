name: DV Harbor bridge checks

on:
  push:
    branches: [feat/harness-router]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run hydrate:pi-ai-data
      - run: npm run build:runtime
      - run: npm run typecheck
      - run: npm test
